name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install NSIS and tools
        run: sudo apt-get update && sudo apt-get install -y nsis unzip osslsigncode
      - uses: actions/cache@v4
        with:
          path: .cache/windows
          key: windows-runtimes-${{ hashFiles('packaging/windows/build.mjs') }}
      - run: npm ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "TABLEWISE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Decode code-signing certificate
        if: env.PFX_BASE64 != ''
        run: |
          echo "$PFX_BASE64" | base64 -d > "$RUNNER_TEMP/sign.pfx"
          echo "WINDOWS_SIGN_PFX=$RUNNER_TEMP/sign.pfx" >> "$GITHUB_ENV"
      - name: Build installer
        env:
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        # Tagged releases refuse to ship the development licence key.
        run: node packaging/windows/build.mjs ${{ startsWith(github.ref, 'refs/tags/v') && '--release' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: TableWise-Windows-Installer
          path: |
            dist/windows/*.exe
            dist/windows/*.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/windows/*.exe dist/windows/*.sha256 --title "TableWise $GITHUB_REF_NAME" --generate-notes
