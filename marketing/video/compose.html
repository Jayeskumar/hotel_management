<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TableWise product video</title>
<style id="fonts"></style>
<style>
  :root { --brand: #14b8a6; --brand2: #0d9488; --deep: #031c1b; --gold: #f5b942; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--deep); }
  body { font-family: 'Inter', 'Noto Sans Tamil', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .ta { font-family: 'Noto Sans Tamil', 'Inter', sans-serif; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: radial-gradient(120% 120% at 20% 10%, #0b3b37 0%, #052523 45%, #03161a 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .grain { position: absolute; inset: 0; opacity: .06; background-image: radial-gradient(rgba(255,255,255,.6) 1px, transparent 1px); background-size: 4px 4px; }
  .scene { position: absolute; inset: 0; will-change: opacity, transform; }

  /* ---------- feature layout */
  .cap { position: absolute; left: 108px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .num { font-size: 20px; letter-spacing: .28em; color: #5eead4; font-weight: 700; display: flex; align-items: center; gap: 14px; }
  .num::after { content: ''; height: 2px; width: 64px; background: linear-gradient(90deg, #5eead4, transparent); }
  .title { font-size: 60px; line-height: 1.04; font-weight: 800; color: #fff; margin-top: 18px; letter-spacing: -.02em; }
  .subta { font-size: 30px; color: #99f6e4; margin-top: 16px; font-weight: 600; line-height: 1.35; }
  .desc { font-size: 23px; color: #cbd5e1; margin-top: 22px; line-height: 1.5; }
  .chips { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: #e2e8f0; padding: 9px 16px; border-radius: 999px; font-size: 18px; font-weight: 500; }
  .win { position: absolute; left: 640px; top: 135px; width: 1200px; height: 790px; border-radius: 16px; overflow: hidden; background: #f8fafc;
         box-shadow: 0 50px 100px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.10); }
  .bar { height: 40px; background: #e5e9ef; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #d5dbe3; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .url { margin-left: 18px; height: 24px; flex: 0 0 520px; border-radius: 8px; background: #fff; color: #64748b; font-size: 13px; display: flex; align-items: center; padding: 0 12px; gap: 8px; }
  .view { position: absolute; top: 40px; left: 0; width: 1200px; height: 750px; overflow: hidden; background: #f8fafc; }
  .view img { position: absolute; left: 0; top: 0; width: 1200px; height: 750px; transform-origin: 0 0; }
  .glow { position: absolute; left: 600px; top: 120px; width: 1280px; height: 840px; border-radius: 40px; background: radial-gradient(closest-side, rgba(20,184,166,.35), transparent); filter: blur(40px); }

  /* ---------- phone */
  .phone { position: absolute; left: 1090px; top: 68px; width: 444px; height: 944px; border-radius: 62px; background: #0b1220; padding: 16px;
           box-shadow: 0 50px 110px rgba(0,0,0,.6), inset 0 0 0 2px #334155, 0 0 0 1px rgba(255,255,255,.08); }
  .screen { position: relative; width: 412px; height: 912px; border-radius: 48px; overflow: hidden; background: #fff; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; border-radius: 20px; background: #0b1220; z-index: 2; }
  .badge { position: absolute; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.95); color: #0f172a; border-radius: 16px; padding: 14px 18px; font-size: 19px; font-weight: 600; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .badge svg { width: 26px; height: 26px; stroke: var(--brand2); }

  /* ---------- receipt */
  .receipt { position: absolute; left: 1330px; top: 112px; width: 420px; background: #fff; padding: 18px 14px 26px; border-radius: 6px;
             box-shadow: 0 40px 90px rgba(0,0,0,.55); }
  .receipt img { width: 100%; display: block; }
  .receipt::after { content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 12px; background: radial-gradient(circle at 8px -2px, transparent 8px, #fff 9px) repeat-x; background-size: 16px 12px; }

  /* ---------- title / hook / recap / outro */
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .mark { width: 150px; height: 150px; border-radius: 40px; background: linear-gradient(135deg, #2dd4bf, #0f766e); display: flex; align-items: center; justify-content: center;
          box-shadow: 0 30px 80px rgba(20,184,166,.45), inset 0 2px 0 rgba(255,255,255,.35); }
  .mark svg { width: 82px; height: 82px; stroke: #fff; }
  .word { font-size: 132px; font-weight: 800; color: #fff; letter-spacing: -.04em; margin-top: 34px; display: flex; }
  .word span { display: inline-block; }
  .tag { font-size: 36px; color: #e2e8f0; margin-top: 18px; font-weight: 500; }
  .tagta { font-size: 30px; color: #99f6e4; margin-top: 14px; font-weight: 600; }
  .hookline { font-size: 78px; font-weight: 800; color: #fff; letter-spacing: -.03em; line-height: 1.12; }
  .hookline.dim { color: #94a3b8; }
  .one { font-size: 150px; font-weight: 900; letter-spacing: -.05em; margin-top: 10px;
         background: linear-gradient(90deg, #5eead4, #f5d77a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .grid { display: grid; grid-template-columns: repeat(4, 360px); gap: 22px; margin-top: 46px; }
  .tile { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 22px; padding: 22px 22px; display: flex; align-items: center; gap: 18px; text-align: left; }
  .tile .ic { flex: 0 0 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, rgba(45,212,191,.25), rgba(13,148,136,.15)); display: flex; align-items: center; justify-content: center; }
  .tile svg { width: 30px; height: 30px; stroke: #5eead4; }
  .tile b { display: block; color: #fff; font-size: 22px; font-weight: 700; }
  .tile i { display: block; font-style: normal; color: #99f6e4; font-size: 17px; margin-top: 4px; }
  .h2 { font-size: 64px; font-weight: 800; color: #fff; letter-spacing: -.03em; }
  .cta { margin-top: 40px; padding: 20px 40px; border-radius: 999px; background: linear-gradient(90deg, #14b8a6, #0d9488); color: #fff; font-size: 30px; font-weight: 700;
         box-shadow: 0 20px 60px rgba(20,184,166,.45); }
  .meta { margin-top: 26px; color: #cbd5e1; font-size: 26px; display: flex; gap: 26px; align-items: center; }
  .meta span { display: flex; align-items: center; gap: 10px; }
  .meta svg { width: 26px; height: 26px; stroke: #5eead4; }
  svg { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div>
  <div class="blob" id="b1" style="width:760px;height:760px;background:#0d9488"></div>
  <div class="blob" id="b2" style="width:620px;height:620px;background:#b7791f"></div>
  <div class="blob" id="b3" style="width:540px;height:540px;background:#155e75"></div>
  <div class="grain"></div>
  <div id="scenes"></div>
</div>
<script src="compose.js"></script>
</body>
</html>
